name: Lean proof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Fetch pinned Mathlib proof dependencies
        working-directory: lean
        run: lake exe cache get Mathlib.Data.Rat.Defs Mathlib.Tactic.NormNum Mathlib.Tactic.Linarith
      - name: Check proof in the Lean kernel
        working-directory: lean
        run: lake build
      - name: Compare every public theorem's axioms
        working-directory: lean
        run: |
          lake env lean QuantileCycles.lean > actual-axioms.txt
          diff -u ../results/lean-axioms.txt actual-axioms.txt
